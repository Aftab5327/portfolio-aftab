name: Refresh screenshots

on:
  schedule:
    - cron: "41 4 * * 0" # Sundays 04:41 UTC
  workflow_dispatch:

permissions:
  contents: write

# Shared with "Sync portfolio" so the two never push to main at the same time.
concurrency:
  group: portfolio-sync
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: npm run screenshots

      - name: Commit and push changes
        run: |
          if [ -z "$(git status --porcelain -- public/projects/auto data/screenshots.json)" ]; then
            echo "No screenshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public/projects/auto data/screenshots.json
          git commit -m "chore(media): refresh project screenshots"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
