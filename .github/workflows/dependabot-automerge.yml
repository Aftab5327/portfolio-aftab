name: Dependabot auto-merge

on: pull_request

# Dependabot-triggered runs get a read-only token unless permissions are granted here.
permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Patch and minor only. "Auto-merge" waits for the required status checks
      # (CI) from branch protection, so nothing merges unless CI passes.
      - name: Enable auto-merge (squash) for patch/minor updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Leave major updates for a human
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: echo "Major update (${{ steps.meta.outputs.dependency-names }}); not auto-merging."
